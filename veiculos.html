<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Painel Frota - Veículos</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/table.css">

    <link
        rel="stylesheet"
        href="css/forms.css">

    <link
        rel="stylesheet"
        href="css/loading.css">

</head>

<body>

    <!-- =============================================================== -->
    <!-- CABEÇALHO -->
    <!-- =============================================================== -->

 <header class="header">

          <div class="header-logo">
              
            <img src="assets/img/logo.png" alt="Logo Frota">
              
            </div>

            <div class="header-title">
                
                        <h1> VEÍCULOS </h1>
                
            </div>

            <div class="header-info">
                    
            <div id="clock"

            class="clock"  aria-label="Relógio">

            </div>

            <button

            id="btnFullscreen"

            class="btn-icon"  aria-label="Tela cheia">

                        ⛶

            </button>

            </div>

     
</header>

    <main class="container">

        <!-- =========================================================== -->
        <!-- FORMULÁRIO -->
        <!-- =========================================================== -->

        <section class="card">

            <h2 id="tituloFormulario">

                Novo veículo

            </h2>

            <form id="formVeiculo">

                <div class="grid">

                    <div class="field">

                        <label for="data">

                            Data

                        </label>

                        <input
                            type="date"
                            id="data"
                            required>

                    </div>

                    <div class="field">

                        <label for="placa">

                            Placa

                        </label>

                        <input
                            type="text"
                            id="placa"
                            maxlength="8"
                            required>

                    </div>

                    <div class="field">

                        <label for="modelo">

                            Modelo

                        </label>

                        <input
                            type="text"
                            id="modelo"
                            required>

                    </div>

                    <div class="field">

                        <label for="marca">

                            Marca

                        </label>

                        <input
                            type="text"
                            id="marca"
                            required>

                    </div>

                    <div class="field">

                        <label for="ano">

                            Ano

                        </label>

                        <input
                            type="number"
                            id="ano"
                            min="1900"
                            max="2100">

                    </div>

                    <div class="field">

                        <label for="combustivel">

                            Combustível

                        </label>

                        <select
                            id="combustivel">

                            <option value="">

                                Selecione

                            </option>

                            <option value="GASOLINA">

                                GASOLINA

                            </option>

                            <option value="ETANOL">

                                ETANOL

                            </option>

                            <option value="FLEX">

                                FLEX

                            </option>

                            <option value="DIESEL">

                                DIESEL

                            </option>

                            <option value="ELÉTRICO">

                                ELÉTRICO

                            </option>

                            <option value="HÍBRIDO">

                                HÍBRIDO

                            </option>

                        </select>

                    </div>

                    <div class="field">

                        <label for="km">

                            KM

                        </label>

                        <input
                            type="number"
                            id="km"
                            min="0">

                    </div>

                    <div class="field">

                        <label for="status">

                            Status

                        </label>

                        <select
                            id="status">

                            <option value="ATIVO">

                                ATIVO

                            </option>

                            <option value="MANUTENÇÃO">

                                MANUTENÇÃO

                            </option>

                            <option value="INATIVO">

                                INATIVO

                            </option>

                        </select>

                    </div>

                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Salvar

                    </button>

                    <button
                        type="button"
                        id="btnNovo"
                        class="btn">

                        Novo

                    </button>

                </div>

            </form>

        </section>

        <!-- =========================================================== -->
        <!-- TABELA -->
        <!-- =========================================================== -->

        <section class="card">

            <h2>

                Veículos cadastrados

            </h2>

            <div id="tabelaVeiculos">

            </div>

        </section>

    </main>

    <!-- =============================================================== -->
    <!-- SCRIPT -->
    <!-- =============================================================== -->

    <script
        type="module"
        src="js/pages/veiculos.js">
    </script>

</body>

</html>
